name: Export-Standard-APK
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot & Templates
        run: |
          wget https://downloads.tuxfamily.org/godotengine/3.6/stable/Godot_v3.6-stable_linux_headless.64.zip
          wget https://downloads.tuxfamily.org/godotengine/3.6/stable/Godot_v3.6-stable_export_templates.tpz
          unzip Godot_v3.6-stable_linux_headless.64.zip
          mkdir -p ~/.local/share/godot/templates/3.6.stable
          unzip Godot_v3.6-stable_export_templates.tpz -d templates_temp
          mv templates_temp/templates/* ~/.local/share/godot/templates/3.6.stable/
          rm -rf templates_temp Godot_v3.6-stable_export_templates.tpz

      - name: Create Export Preset
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo '
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          custom_template/release=""
          custom_template/debug=""
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          binary_format/embed_pck=true
          texture_format/etc=true
          texture_format/etc2=true
          ' > export_presets.cfg
          fi

      - name: Build APK
        run: |
          mkdir -v -p build/android
          ./Godot_v3.6-stable_linux_headless.64 --export "Android" build/android/TankGame.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Standard-Game-APK
          path: build/android/*.apk
